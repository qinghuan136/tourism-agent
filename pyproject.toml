[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tourism-agent"
version = "0.1.0"
description = "基于 LangGraph 的旅行规划 Agent"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0,<5.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-mcp-adapters>=0.3.2,<1.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "uvicorn>=0.34,<1.0",
]

[project.scripts]
tourism-db-init = "tourism_agent.infrastructure.migrations:main"
tourism-db-seed = "tourism_agent.infrastructure.seeds:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tourism_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
